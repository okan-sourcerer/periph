[package]
name = "periphd"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
periph-core = { path = "../periph-core" }
anyhow = "1.0.104"
env_logger = "0.11.11"
evdev = "0.13.2"
libc = "=0.2.189"
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
zbus = { version = "=5.19.0", default-features = false, features = ["tokio"] }
