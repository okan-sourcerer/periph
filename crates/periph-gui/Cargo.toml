[package]
name = "periph-gui"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "periph"
path = "src/main.rs"

[dependencies]
periph-core = { path = "../periph-core" }
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_4"] }
anyhow = "1.0.104"
async-channel = "2.5.0"
futures-lite = "2.6.1"
serde_json = "=1.0.151"
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_12"] }
ksni = { version = "=0.3.6", default-features = false, features = ["async-io"] }
zbus = { version = "=5.19.0", default-features = false, features = ["async-io"] }
